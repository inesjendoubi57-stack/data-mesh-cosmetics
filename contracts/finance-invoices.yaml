name: finance-invoices
version: 1.0.0
owner: finance-team
description: Factures et paiements clients
schema:
  - {name: invoice_id,     type: string, required: true}
  - {name: order_id,       type: string, required: true}
  - {name: amount,         type: float,  required: true}
  - {name: currency,       type: string, required: true}
  - {name: payment_method, type: string, required: true}
  - {name: payment_status, type: string, required: true}
invariants:
  - "amount > 0"
  - "invoice_id is unique"
sla:
  freshness_max_minutes: 30
  availability_percent: 99.5
compatibility: backward