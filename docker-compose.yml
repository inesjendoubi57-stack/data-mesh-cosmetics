x-mesh: &mesh
  build: .

services:
  merchandising:
    <<: *mesh
    working_dir: /app/backend/merchandising
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]

  fulfillment:
    <<: *mesh
    working_dir: /app/backend/fulfillment
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    ports: ["8002:8002"]

  customer_finance:
    <<: *mesh
    working_dir: /app/backend/customer_finance
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
    ports: ["8003:8003"]

  registry:
    <<: *mesh
    working_dir: /app/governance
    command: uvicorn registry_api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]

  catalog:
    <<: *mesh
    working_dir: /app/catalog
    command: python manage.py runserver 0.0.0.0:8080 --noreload
    ports: ["8080:8080"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MERCHANDISING_HOST: merchandising
      FULFILLMENT_HOST: fulfillment
      FINANCE_HOST: customer_finance
    depends_on: [merchandising, fulfillment, customer_finance]
