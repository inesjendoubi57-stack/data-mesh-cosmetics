{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Data Catalog{% endblock %} · Éclat</title>
  <style>
    :root { --ink: #000; --slate: #464545; --graphite: #666; --ash: #e8e8e8; --mist: #f0f0f0; --fog: #f7f7f7;
            --blush: #faf2f4; --paper: #fff; --yellow: #fff116; --cobalt: #0600ff;
            --sans: "Apercu", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
            --mono: "Apercu Mono", "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace; }
    * { box-sizing: border-box; border-radius: 0; }
    body { margin: 0; font-family: var(--sans); font-size: 16px; line-height: 1.5; letter-spacing: .002em; color: var(--ink); background: var(--fog); }
    a { color: inherit; }
    .label, th, nav a, button, .badge { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
    header { background: var(--paper); border-bottom: 1px solid var(--ash); }
    header .inner { max-width: 1440px; margin: 0 auto; padding: 0 40px; height: 64px; display: flex; align-items: center; gap: 40px; }
    .brand { font-size: 24px; font-weight: 700; letter-spacing: -.02em; text-decoration: none; }
    nav { display: flex; gap: 32px; }
    nav a { text-decoration: none; }
    nav a:hover { text-decoration: underline; text-underline-offset: 6px; }
    header .right { margin-left: auto; color: var(--graphite); }
    main { max-width: 1440px; margin: 0 auto; padding: 0 40px 64px; }
    .hero { display: grid; grid-template-columns: 5fr 7fr; margin: 0 -40px 64px; background: var(--paper); }
    .hero .copy { padding: 64px 40px; align-self: center; }
    .hero .shots { display: grid; grid-template-columns: 1fr 1fr; }
    .hero img { width: 100%; height: 420px; object-fit: cover; display: block; }
    .page-head { padding: 64px 0 40px; max-width: 760px; }
    .label { color: var(--graphite); margin: 0 0 16px; display: block; }
    h1 { font-size: 32px; font-weight: 700; line-height: 1.2; letter-spacing: -.1px; margin: 0 0 16px; }
    h2 { font-size: 20px; font-weight: 500; line-height: 1.3; margin: 64px 0 16px; }
    .lead { color: var(--graphite); margin: 0 0 32px; max-width: 520px; }
    form.search { display: flex; max-width: 460px; }
    form.search input { flex: 1; font: inherit; padding: 14px 16px; border: 1px solid var(--ash); border-right: 0; background: var(--paper); outline: none; }
    form.search input:focus { border-color: var(--ink); }
    button, .button { font-family: inherit; background: var(--yellow); color: var(--ink); border: 0; padding: 15px 24px; cursor: pointer; text-decoration: none; display: inline-block; }
    code { font-family: var(--mono); font-size: 13px; background: var(--mist); padding: 2px 6px; }
    .rows { display: grid; gap: 2px; }
    .row { background: var(--paper); padding: 24px; display: grid; grid-template-columns: 2.4fr 1fr 1.2fr .6fr .6fr 1.2fr; gap: 24px; align-items: center; text-decoration: none; }
    .row.head { background: transparent; padding: 0 24px 10px; color: var(--graphite); }
    a.row:hover .title { text-decoration: underline; text-underline-offset: 5px; }
    .title { font-size: 20px; font-weight: 500; line-height: 1.3; }
    .sub { font-size: 14px; color: var(--graphite); }
    .badge { display: inline-block; padding: 6px 10px; background: var(--ash); white-space: nowrap; }
    .badge.bad { background: var(--ink); color: var(--paper); }
    .badge.warn { background: var(--cobalt); color: var(--paper); }
    .badge.off { background: transparent; border: 1px solid var(--ash); color: var(--graphite); }
    .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-bottom: 24px; }
    .fact { background: var(--paper); padding: 24px; font-size: 20px; font-weight: 500; }
    .fact .label { margin-bottom: 8px; }
    .surface { background: var(--paper); padding: 8px 24px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 14px 16px 14px 0; border-bottom: 1px solid var(--ash); font-size: 14px; vertical-align: top; }
    th { color: var(--graphite); }
    tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; font-family: var(--mono); }
    .tabs { display: flex; flex-wrap: wrap; gap: 32px; margin-bottom: 24px; border-bottom: 1px solid var(--ash); }
    .tabs a { font-size: 14px; text-decoration: none; color: var(--graphite); padding: 12px 0; margin-bottom: -1px; border-bottom: 2px solid transparent; }
    .tabs a.on { color: var(--ink); border-color: var(--ink); }
    .alert { background: var(--ink); color: var(--paper); padding: 16px 24px; }
    pre { white-space: pre-wrap; margin: 0; font-family: var(--mono); font-size: 13px; line-height: 1.7; }
    .bar { height: 14px; background: var(--ink); min-width: 4px; }
    .muted { color: var(--graphite); font-size: 14px; }
    footer { background: var(--blush); padding: 32px 40px; color: var(--graphite); display: flex; gap: 40px; }
    footer .label { margin: 0; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <a class="brand" href="{% url 'home' %}">Éclat.</a>
      <nav>
        <a href="{% url 'home' %}">Data products</a>
        <a href="{% url 'revenue' %}">Analyse cross-domain</a>
      </nav>
      <span class="right label" style="margin:0 0 0 auto">Data Catalog</span>
    </div>
  </header>
  <main>
    {% if error %}<p class="alert" style="margin-top:40px">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span class="label">Merchandising</span><span class="label">Fulfillment</span><span class="label">Customer Finance</span>
  </footer>
</body>
</html>
